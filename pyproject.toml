[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "dream-embed"
version         = "0.1.0"
description     = "Language-agnostic sentence embeddings via DREAM disentanglement (EMNLP 2021)"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
api  = ["fastapi>=0.111", "uvicorn[standard]>=0.29", "pydantic>=2.7"]
demo = ["gradio>=4.36", "plotly>=5.22"]
dev  = ["pytest>=8.2", "ruff>=0.4", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Tool config
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]   # line length handled by formatter

[tool.mypy]
python_version     = "3.10"
ignore_missing_imports = true
strict             = false

[tool.pytest.ini_options]
testpaths    = ["tests"]
pythonpath   = ["src"]
addopts      = "-v --tb=short"
